# week-planner-card configuration for WebUntis timetable
# Requires: https://github.com/FamousWolf/week-planner-card (install via HACS)

type: custom:week-planner-card
title: "Student Timetable"
startingDay: saturday
startingDayOffset: "2"
calendars:
  - entity: calendar.your_local_calendar   # replace with your local calendar entity
showNavigation: true
grid_options:
  columns: full
  rows: auto
days: "5"
hideWeekend: true
combineSimilarEvents: false
showDescription: false
showLocation: true
showTitle: true
compact: false
showLegend: false
maxEvents: "0"
hidePastEvents: false
legendToggle: false
locale: de-DE
weather:
  entity: weather.forecast_home   # replace with your weather entity
  showCondition: true
  showTemperature: true
  showLowTemperature: true
texts:
  today: heute
  tomorrow: morgen
  yesterday: gestern
  noEvents: schulfrei
card_mod:
  style: >
    /* Subject color coding - adjust to match your school's subjects */
    .event[data-summary*="Mathematik"],
    .event[data-summary*="Deutsch"],
    .event[data-summary*="Biologie"],
    .event[data-summary*="Sport"],
    .event[data-summary*="Kunst"],
    .event[data-summary*="Religion"],
    .event[data-summary*="Klassenleitung"],
    .event[data-summary*="Englisch"],
    .event[data-summary*="Musik"] {
      color: white !important;
    }
    .event[data-summary*="Mathematik"] {
      border-color: rgba(0, 0, 139, 0.7) !important;
      background-color: rgba(0, 0, 139, 0.5) !important;
    }
    .event[data-summary*="Deutsch"] {
      border-color: rgba(165, 42, 42, 0.7) !important;
      background-color: rgba(165, 42, 42, 0.5) !important;
    }
    .event[data-summary*="Biologie"] {
      border-color: rgba(0, 100, 0, 0.7) !important;
      background-color: rgba(0, 100, 0, 0.5) !important;
    }
    .event[data-summary*="Sport"] {
      border-color: rgba(255, 69, 0, 0.7) !important;
      background-color: rgba(255, 69, 0, 0.5) !important;
    }
    .event[data-summary*="Kunst"] {
      border-color: rgba(255, 140, 0, 0.7) !important;
      background-color: rgba(255, 140, 0, 0.5) !important;
    }
    .event[data-summary*="Religion"] {
      border-color: rgba(105, 105, 105, 0.7) !important;
      background-color: rgba(105, 105, 105, 0.5) !important;
    }
    .event[data-summary*="Klassenleitung"] {
      border-color: rgba(46, 139, 87, 0.7) !important;
      background-color: rgba(46, 139, 87, 0.5) !important;
    }
    .event[data-summary*="Englisch"] {
      border-color: rgba(128, 0, 128, 0.7) !important;
      background-color: rgba(128, 0, 128, 0.5) !important;
    }
    .event[data-summary*="Musik"] {
      border-color: rgba(218, 165, 32, 0.7) !important;
      background-color: rgba(218, 165, 32, 0.5) !important;
    }
    /* Invisible placeholder events (keeps row heights consistent) */
    .event[data-summary=" "] {
      opacity: 0 !important;
      min-height: 78px !important;
      pointer-events: none !important;
    }
    /* Changed lessons - orange left border */
    .event[data-summary*="⚠️"] {
      border-left: 4px solid rgba(255, 165, 0, 1) !important;
    }
    /* Cancelled lessons - strikethrough */
    .event[data-summary*="❌"] {
      text-decoration: line-through !important;
      opacity: 0.6 !important;
    }
