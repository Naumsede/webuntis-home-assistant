# WebUntis → Home Assistant — week-planner-card example
#
# Requires the custom cards:
#   - week-planner-card  (HACS)
#   - card-mod           (HACS)
#
# The subject colors rely on the invisible Braille-blank anchor (U+2800, ⠀)
# that webuntis_calendar.py appends after the ACTIVE subject. The CSS selectors
# match `Subject⠀` (subject + anchor), so in a merged event like
# "⚠️ German⠀[statt: Music]" only the active subject (German) is colored —
# the cancelled subject in brackets has no anchor and is ignored.
#
# Replace the subject names below with the ones from YOUR timetable. The anchor
# character ⠀ after each subject is REQUIRED — copy it together with the name.

type: custom:week-planner-card
title: Timetable
startingDay: Saturday
startingDayOffset: "2"
calendars:
  - entity: calendar.student1_timetable
  # Add further calendars (e.g. extracurricular activities) here:
  # - entity: calendar.student1_clubs
showNavigation: true
grid_options:
  columns: full
  rows: auto
days: "5"
hideWeekend: true
combineSimilarEvents: false
showDescription: false
weather:
  entity: weather.forecast_home
  showCondition: true
  showTemperature: true
  showLowTemperature: true
showTitle: true
showLocation: true
compact: false
showLegend: false
maxEvents: "0"
hidePastEvents: false
legendToggle: false
locale: de-DE
texts:
  today: today
  tomorrow: tomorrow
  yesterday: yesterday
  noEvents: no school
card_mod:
  style: >
    ha-card {
      max-width: 100% !important;
      width: 100% !important;
    } .days {
      display: flex !important;
      gap: 6px !important;
    } .day {
      flex: 1 1 0px !important;
      min-width: 0 !important;
      padding: 2px !important;
    } .event-name {
      font-size: 0.9rem !important;
      line-height: 1.1 !important;
    } /* Text color for subjects with the anchor */
    .event[data-summary*="Mathematik⠀"], .event[data-summary*="Deutsch⠀"], 
    .event[data-summary*="Biologie⠀"], .event[data-summary*="Sport⠀"], 
    .event[data-summary*="Kunst⠀"], .event[data-summary*="Religion⠀"], 
    .event[data-summary*="Klassenleitung⠀"], .event[data-summary*="Englisch⠀"], 
    .event[data-summary*="Musik⠀"], .event[data-summary*="Imkerei"] {
      color: white !important;
    } /* Color codes (border & background) */ .event[data-summary*="Mathematik⠀"]
    { border-color: rgba(0, 0, 139, 0.7) !important; background-color: rgba(0,
    0, 139, 0.5) !important; } .event[data-summary*="Deutsch⠀"] { border-color:
    rgba(165, 42, 42, 0.7) !important; background-color: rgba(165, 42, 42, 0.5)
    !important; } .event[data-summary*="Biologie⠀"] { border-color: rgba(0, 100,
    0, 0.7) !important; background-color: rgba(0, 100, 0, 0.5) !important; }
    .event[data-summary*="Sport⠀"] { border-color: rgba(255, 69, 0, 0.7)
    !important; background-color: rgba(255, 69, 0, 0.5) !important; }
    .event[data-summary*="Kunst⠀"] { border-color: rgba(255, 140, 0, 0.7)
    !important; background-color: rgba(255, 140, 0, 0.5) !important; }
    .event[data-summary*="Religion⠀"] { border-color: rgba(105, 105, 105, 0.7)
    !important; background-color: rgba(105, 105, 105, 0.5) !important; }
    .event[data-summary*="Klassenleitung⠀"] { border-color: rgba(46, 139, 87,
    0.7) !important; background-color: rgba(46, 139, 87, 0.5) !important; }
    .event[data-summary*="Englisch⠀"] { border-color: rgba(128, 0, 128, 0.7)
    !important; background-color: rgba(128, 0, 128, 0.5) !important; }
    .event[data-summary*="Musik⠀"] { border-color: rgba(218, 165, 32, 0.7)
    !important; background-color: rgba(218, 165, 32, 0.5) !important; }
    .event[data-summary*="Imkerei"] { border-color: rgba(139, 90, 43, 0.7)
    !important; background: linear-gradient(135deg, rgba(101, 67, 33, 0.6),
    rgba(210, 160, 30, 0.6), rgba(101, 67, 33, 0.6)) !important; } /*
    Special styling for cancellations (matches "fällt aus⠀") */
    .event[data-summary*="fällt aus"] {
      background-color: transparent !important;
      text-decoration: line-through !important;
      opacity: 0.6 !important;
      border-right-color: transparent !important;
      border-top-color: transparent !important;
      border-bottom-color: transparent !important;
      border-left-width: 5px !important; /* thicker left bar */
    } /* Styling for placeholder slots and warnings */ .event[data-summary=" "] {
    opacity: 0 !important; min-height: 78px !important; pointer-events: none
    !important; } .event[data-summary*="⚠️"] { border-left-width: 5px
    !important; border-left-style: solid !important; border-left-color:
    rgba(255, 165, 0, 1) !important; }
