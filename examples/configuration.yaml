# Add to your configuration.yaml
# Adjust entity names, script paths and credentials to match your setup

# ── OPTION A: Credentials as environment variables (more secure) ─────────────
# Pass credentials directly in the command - nothing stored in the script file.
# Use single quotes around values to handle special characters.

command_line:
  - sensor:
      name: "WebUntis Changes Student1"
      unique_id: webuntis_changes_student1
      command: >
        WEBUNTIS_USER='your@email.com'
        WEBUNTIS_PASSWORD='yourpassword'
        WEBUNTIS_SERVER='your-school.webuntis.com'
        WEBUNTIS_SCHOOL='your-school'
        python3 /config/scripts/webuntis_calendar.py
      scan_interval: 7200
      command_timeout: 60
      value_template: "{{ value_json.changes | default(0) }}"
      json_attributes:
        - items
        - events

  - sensor:
      name: "WebUntis Messages"
      unique_id: webuntis_messages
      command: >
        WEBUNTIS_USER='your@email.com'
        WEBUNTIS_PASSWORD='yourpassword'
        WEBUNTIS_SERVER='your-school.webuntis.com'
        WEBUNTIS_SCHOOL='your-school'
        python3 /config/scripts/webuntis_newsfeed.py
      scan_interval: 1800
      command_timeout: 30
      value_template: "{{ value_json.count | default(0) }}"
      json_attributes:
        - items

# ── OPTION B: Credentials hardcoded in script (simpler, less secure) ─────────
# Edit USERNAME/PASSWORD/SERVER/SCHOOL directly in the script files.
# Make sure the scripts are not publicly accessible.

