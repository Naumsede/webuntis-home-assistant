# Add to your configuration.yaml
# Adjust entity names and script paths to match your setup

command_line:
  # Timetable sensor - writes ICS calendar and exposes change count + details
  - sensor:
      name: "WebUntis Changes Student1"
      unique_id: webuntis_changes_student1
      command: "python3 /config/scripts/webuntis_calendar.py"
      scan_interval: 7200        # refresh every 2 hours
      command_timeout: 60
      value_template: "{{ value_json.changes }}"
      json_attributes:
        - items
        - events

  # Add more students by copying the block above and adjusting the script path

  # Daily school messages sensor
  - sensor:
      name: "WebUntis Messages"
      unique_id: webuntis_messages
      command: "python3 /config/scripts/webuntis_newsfeed.py"
      scan_interval: 1800        # refresh every 30 minutes
      command_timeout: 30
      value_template: "{{ value_json.count }}"
      json_attributes:
        - items
