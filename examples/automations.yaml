# Automations for WebUntis HA integration

- alias: "WebUntis Morning Refresh"
  description: "Force timetable update at 6 AM on school days"
  triggers:
    - trigger: time
      at: "06:00:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.webuntis_changes_student1
  mode: single

- alias: "WebUntis Timetable Changes"
  description: "Notify only on genuinely new timetable changes"
  mode: parallel
  max: 10
  triggers:
    - trigger: state
      entity_id: sensor.webuntis_changes_student1
      id: Student1
      not_from: [unknown, unavailable, none]
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  actions:
    - variables:
        new_items: >-
          {% set old_texts = trigger.from_state.attributes['items'] | default([]) | map(attribute='text') | list %}
          {% set curr_items = trigger.to_state.attributes['items'] | default([]) %}
          {{ curr_items | rejectattr('text', 'in', old_texts) | list }}
        message_text: >-
          {% if new_items | count > 0 %}
          {% for i in new_items %}{{ i.day }}: {{ i.text }}{{ '\n' if not loop.last }}{% endfor %}
          {% else %}
          No new details found.
          {% endif %}
    - action: notify.notify
      data:
        title: "📅 Timetable Change – {{ trigger.id }}"
        message: "{{ message_text }}"
    - action: persistent_notification.create
      data:
        title: "📅 Timetable Change – {{ trigger.id }}"
        message: "{{ message_text }}"

- alias: "WebUntis New School Messages"
  description: "Notify only on genuinely new school messages"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.webuntis_messages
      not_from: [unknown, unavailable, none]
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  actions:
    - variables:
        new_items: >-
          {% set old_texts = trigger.from_state.attributes['items'] | default([]) | map(attribute='text') | list %}
          {% set curr_items = trigger.to_state.attributes['items'] | default([]) %}
          {{ curr_items | rejectattr('text', 'in', old_texts) | list }}
        message_text: >-
          {% if new_items | count > 0 %}
          {% for m in new_items %}{{ m.text }}{{ '\n' if not loop.last }}{% endfor %}
          {% else %}
          No message text available.
          {% endif %}
    - action: notify.notify
      data:
        title: "📢 New School Message"
        message: "{{ message_text }}"
    - action: persistent_notification.create
      data:
        title: "📢 New School Message"
        message: "{{ message_text }}"
