# WebUntis → Home Assistant — example automations
#
# Three automations:
#   1. Timetable changes per student (parallel, one trigger per student sensor)
#   2. Daily school messages
#   3. Morning refresh (forces a fresh fetch before school starts)
#
# Adjust entity_ids, notify target and calendar entities to match your setup.
# notify.mobile_app_your_phone is the default mobile-app notify service —
# replace it with your own (e.g. notify.mobile_app_<your_device>).

# ── 1. Timetable changes (per student) ───────────────────────────────────────
- alias: WebUntis timetable changes
  description: >-
    Reports only genuinely new timetable entries. One trigger per student
    sensor; trigger.id is used as the student label in the notification.
  triggers:
    - trigger: state
      entity_id: sensor.webuntis_changes_student1
      id: Student1
      not_from:
        - unknown
        - unavailable
        - none
    - trigger: state
      entity_id: sensor.webuntis_changes_student2
      id: Student2
      not_from:
        - unknown
        - unavailable
        - none
  conditions:
    # Only fire when the change count actually increased
    - condition: template
      value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  actions:
    # Reload the local calendars so the new ICS is picked up immediately
    - action: homeassistant.reload_config_entry
      target:
        entity_id:
          - calendar.student1_timetable
          - calendar.student2_timetable
    - delay:
        seconds: 2
    - variables:
        new_items: >-
          {% set old_texts = trigger.from_state.attributes['items'] | default([])
          | map(attribute='text') | list %} {% set curr_items =
          trigger.to_state.attributes['items'] | default([]) %} {{ curr_items |
          rejectattr('text', 'in', old_texts) | list }}
        message_text: >-
          {% if new_items | count > 0 %} {% for i in new_items %}{{ i.day }}: {{
          i.text }}{{ '\n' if not loop.last }}{% endfor %} {% else %} No new
          details found. {% endif %}
    - action: notify.mobile_app_your_phone
      data:
        message: "{{ message_text }}"
        title: "📅 Timetable change {{ trigger.id }}"
    - action: persistent_notification.create
      data:
        message: "{{ message_text }}"
        title: "📅 Timetable change {{ trigger.id }}"
  mode: parallel
  max: 10

# ── 2. Daily school messages ─────────────────────────────────────────────────
- alias: WebUntis school messages
  description: Reports new or changed daily school messages
  triggers:
    - trigger: state
      entity_id: sensor.webuntis_messages
      attribute: items
      not_from:
        - unknown
        - unavailable
        - none
  conditions:
    - condition: template
      value_template: >-
        {{ state_attr('sensor.webuntis_messages', 'items') | default([]) | count
        > 0 }}
    - condition: template
      value_template: >-
        {% set old_texts = (trigger.from_state.attributes['items'] if
        trigger.from_state else []) | map(attribute='text') | list %} {% set
        curr_items = state_attr('sensor.webuntis_messages', 'items') | default([])
        %} {{ curr_items | rejectattr('text', 'in', old_texts) | list | count > 0
        }}
  actions:
    - variables:
        new_items: >-
          {% set old_texts = (trigger.from_state.attributes['items'] if
          trigger.from_state else []) | map(attribute='text') | list %} {% set
          curr_items = state_attr('sensor.webuntis_messages', 'items') |
          default([]) %} {{ curr_items | rejectattr('text', 'in', old_texts) |
          list }}
        message_text: >-
          {% for m in new_items %}{{ m.text }}{{ '\n' if not loop.last }}{% endfor
          %}
    - action: notify.mobile_app_your_phone
      data:
        message: "{{ message_text }}"
        title: "📢 New school message"
    - action: persistent_notification.create
      data:
        message: "{{ message_text }}"
        title: "📢 New school message"
  mode: single

# ── 3. Morning refresh ───────────────────────────────────────────────────────
# The command_line sensors poll on their own scan_interval (e.g. every 2 hours),
# so the exact times they run drift. This forces a fresh fetch shortly before
# school starts. homeassistant.update_entity runs the sensor's command, which
# also rewrites the ICS file — no extra shell_command needed.
# If it finds new changes, automation 1 fires and reloads the calendars.
- alias: WebUntis morning refresh
  description: Forces a timetable fetch on school mornings
  triggers:
    - trigger: time
      at: "06:30:00"
    - trigger: time
      at: "07:00:00"
    - trigger: time
      at: "07:30:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.webuntis_changes_student1
          - sensor.webuntis_changes_student2
  mode: single
